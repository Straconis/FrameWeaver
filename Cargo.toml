[package]
name = "frameweaver"
version = "0.5.0"
edition = "2021"
description = "Turn pictures into a time-lapse video of any length."
license = "MIT"
repository = "https://github.com/Straconis/FrameWeaver"
build = "build.rs"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
